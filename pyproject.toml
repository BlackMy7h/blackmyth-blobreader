[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blobreader"
version = "1.0.0"
description = "Decode & inspect blobs: tokens, serialized objects, encodings, compression - with auto-detect."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "BlackMy7h" }]
keywords = ["deserialization", "decoder", "flask", "jwt", "pickle", "burp", "ctf", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Environment :: Console",
]

[project.optional-dependencies]
yaml = ["pyyaml"]

[project.scripts]
blobreader = "blobreader.cli:main"

[tool.setuptools.packages.find]
include = ["blobreader*"]
